[package]
name = "mdbase-runtime"
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.94"
description = "Durable, provider-neutral workflow runtime for mdbase"
license = "MIT"
repository = "https://github.com/callumalpass/mdbase-rs"
homepage = "https://mdbase.dev"

[features]
default = ["sqlite"]
postgres = ["dep:sqlx"]
sqlite = ["dep:rusqlite"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
mdbase = { version = "0.4.0-rc.2", path = "../.." }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = { version = "0.1", optional = true }
ulid = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
