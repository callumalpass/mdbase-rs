name: Flake stress

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Repetitions per suite (1-1000, no retries)
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: flake-stress
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
  STRESS_ITERATIONS: ${{ inputs.iterations || '20' }}

jobs:
  stress:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read the canonical pin, rather than maintaining a second spec revision.
      - id: spec
        run: echo "revision=$(python -c 'import re; print(re.search(r"MDBASE_SPEC_REVISION:\s*([0-9a-f]{40})", open(".github/workflows/ci.yml").read())[1])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdbase-dev/mdbase-spec
          ref: ${{ steps.spec.outputs.revision }}
          path: mdbase-spec
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: rustup override set 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'macOS'
        run: brew install cpulimit
      - name: Repeat timing-sensitive suites with a two-CPU budget
        env:
          MDBASE_SPEC_REPO_DIR: ${{ github.workspace }}/mdbase-spec
          MDBASE_SPEC_TESTS_DIR: ${{ github.workspace }}/mdbase-spec/tests
        run: >-
          node scripts/ci/two-cpus.mjs scripts/ci/cargo-test.mjs
          --stress "$STRESS_ITERATIONS" --match 'type_file|concurrent|durab|lease|crash|recover|watch|restart'
          --locked -p mdbase -p mdbase-runtime --lib --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stress-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: .ci-flakes/
          include-hidden-files: true
          retention-days: 14

  report:
    needs: stress
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stress-evidence-*
          path: stress-evidence
      - name: Open or update the single tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/track-flakes.mjs stress-evidence
