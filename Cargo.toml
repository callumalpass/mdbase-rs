[package]
name = "mdbase"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mdb"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
glob = "0.3"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
notify = "7"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
insta = "1"
tempfile = "3"
regex = "1"
