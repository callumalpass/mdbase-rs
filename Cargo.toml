[package]
name = "mdbase"
version = "0.4.0-rc.4"
edition = "2021"
rust-version = "1.94"
description = "Rust implementation of the mdbase specification"
license = "MIT"
repository = "https://github.com/callumalpass/mdbase-rs"
homepage = "https://github.com/callumalpass/mdbase-rs"
include = [
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/benchmarks/**",
    "/conformance/**",
    "/docs/**",
    "/LICENSE",
    "/schemas/v0.3/**",
    "/scripts/**",
    "/src/**",
    "/tests/**",
]

[workspace]
members = [
    ".",
    "crates/mdbase-command",
    "crates/mdbase-runtime",
    "crates/mdbase-testbed-adapter",
]
resolver = "2"

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
regex = "1"
fancy-regex = "0.14"
fs2 = "0.4"
semver = "1"
serde_jcs = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rand = "0.8.6"
jsonschema = { version = "0.18", features = ["draft202012"] }
walkdir = "2"
notify = "8"
tempfile = "3"
tracing = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/callumalpass/mdbase-rs"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
insta = "1"
regex = "1"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
