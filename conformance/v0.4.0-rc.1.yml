kind: mdbase.conformance
status: verified
implementation:
  id: mdbase-rs
  name: mdbase Rust implementation
  version: 0.4.0-rc.1
  language: Rust
  target: crate
  url: https://github.com/callumalpass/mdbase-rs
spec_version: 0.3.0
runtime_profile_version: 0.1.0
profiles:
  - core_read
  - collection_semantics
  - cel
  - cel_match
  - cel_query
  - links
  - core_write
  - lifecycle
  - runtime_contracts/0.1
  - watch
optional_features:
  - runtime_contract_materialization
json_schema:
  dialect: https://json-schema.org/draft/2020-12/schema
  keywords:
    - type
    - required
    - properties
    - additionalProperties
    - items
    - enum
    - const
    - oneOf
    - anyOf
    - allOf
    - if
    - then
    - else
    - minimum
    - maximum
    - exclusiveMinimum
    - exclusiveMaximum
    - multipleOf
    - minLength
    - maxLength
    - pattern
    - minItems
    - maxItems
    - uniqueItems
    - $defs
    - $ref
    - title
    - description
    - default
    - examples
  formats:
    - date
    - date-time
    - time
  remote_refs: false
compatibility:
  v0_2_read: true
  v0_2_migrate: true
limits:
  external_schema_refs: false
  schema_ref_roots:
    - collection_root
    - ancestor_pack_schemas/v0.3
  operation_surface: typed_collection
  cel_source_bytes: 65536
  cel_ast_depth: 128
  cel_evaluation_depth: 128
  cel_evaluation_steps: 1000000
  cel_as_file_hops: 10
  cel_clock_scope: operation
  watch_debounce: host_configurable
  runtime_execution: false
  runtime_external_schema_refs: false
  runtime_source_order:
    - built_in
    - provider_id
    - pack_id
    - collection_path
  runtime_authorization: embedding_host_final_boundary
