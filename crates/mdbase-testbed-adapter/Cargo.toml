[package]
name = "mdbase-testbed-adapter"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Black-box mdbase contract and runtime testbed adapter"

[dependencies]
async-trait = "0.1"
chrono.workspace = true
mdbase = { path = "../.." }
mdbase-interop = { version = "0.1.0-rc.2", git = "https://github.com/mdbase-dev/mdbase-spec.git", rev = "5aa34fd14de2e0ae9e565425b724b306046b64ca" }
mdbase-runtime = { path = "../mdbase-runtime" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ulid = "1"
