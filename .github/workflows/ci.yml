name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout mdbase spec
        uses: actions/checkout@v4
        with:
          repository: callumalpass/mdbase-spec
          path: mdbase-spec
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
        env:
          MDBASE_SPEC_REPO_DIR: ${{ github.workspace }}/mdbase-spec
          MDBASE_SPEC_TESTS_DIR: ${{ github.workspace }}/mdbase-spec/tests
      - name: Verify crate package
        run: cargo package
