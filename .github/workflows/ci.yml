name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MDBASE_SPEC_REVISION: 5aa34fd14de2e0ae9e565425b724b306046b64ca

jobs:
  quality:
    name: Format, lint, docs, and features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Enforce architecture and debt budgets
        run: cargo run --locked -p mdbase-architecture-check -- .
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Strict canonical no-default lint gates
        run: |
          cargo clippy --locked -p mdbase --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p mdbase-command --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p mdbase-runtime --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p mdbase-testbed-adapter --all-targets -- -D warnings
      - run: ./scripts/check-legacy-feature-boundary.sh
      - name: Reject legacy mutation feature in canonical resolved graphs
        run: ./scripts/check-no-legacy-feature.sh
      - run: cargo test --locked -p mdbase --no-default-features backfill
      - run: cargo test --locked -p mdbase-command --no-default-features
      - run: cargo test --locked -p mdbase-runtime --no-default-features
      - run: cargo test --locked -p mdbase-runtime --no-default-features --features sqlite
      - run: cargo check --locked -p mdbase-runtime --no-default-features --features postgres
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned mdbase spec
        uses: actions/checkout@v4
        with:
          repository: mdbase-dev/mdbase-spec
          ref: ${{ env.MDBASE_SPEC_REVISION }}
          path: mdbase-spec
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - name: Compile every Windows target, including capability publication
        if: runner.os == 'Windows'
        run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features
        env:
          MDBASE_SPEC_REPO_DIR: ${{ github.workspace }}/mdbase-spec
          MDBASE_SPEC_TESTS_DIR: ${{ github.workspace }}/mdbase-spec/tests
      - name: Install portable testbed runner
        working-directory: mdbase-spec/packages/testbed
        run: npm ci
      - name: Run contract and durable runtime black-box scenarios
        run: >-
          node mdbase-spec/packages/testbed/src/cli.mjs run
          --adapter command:cargo
          --adapter-arg run
          --adapter-arg --quiet
          --adapter-arg -p
          --adapter-arg mdbase-testbed-adapter
          --adapter-arg --
          --timeout-ms 120000

  postgres:
    name: Live PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mdbase-test
          POSTGRES_DB: mdbase_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mdbase_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Run mandatory PostgreSQL contracts
        run: cargo test --locked -p mdbase-runtime --all-features --test postgres --test store_contract
        env:
          MDBASE_RUNTIME_REQUIRE_POSTGRES: "1"
          MDBASE_RUNTIME_TEST_DATABASE_URL: postgres://postgres:mdbase-test@127.0.0.1:5432/mdbase_runtime_test

  package:
    name: Package publishable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Package crates whose registry dependencies are available
        run: cargo package --locked -p mdbase -p mdbase-command
      - name: Verify runtime package contents before dependency publication
        run: cargo package --locked --list -p mdbase-runtime

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
